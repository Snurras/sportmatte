<style>
/* Layout: one centered column. Home = 80s sunset poster hero with the lifter, badge shelf, level cards, record boards.
   Play = equation card + big numpad. Deliberate single bright theme (pink kids' world + synthwave hero). */
:root{
  --bg:#FFE3F0; --bg-2:#FFF4F9; --card:#FFFFFF; --ink:#4A1838; --ink-soft:#8A4F72;
  --pink:#FF3E9A; --pink-deep:#C81C72; --line:#F5B5D3;
  --r:#FF595E; --o:#FF9F1C; --y:#FFCA3A; --g:#38C98A; --b:#3FA9F5; --v:#9B5DE5;
  --rt:#E0353B; --ot:#E2700A; --yt:#C08600; --gt:#14935B; --bt:#1474C4; --vt:#7536CF;
  --gold:#F6B92B; --silver:#B6C2D4; --bronze:#D98A4E;
  --night:#24083F; --neon:#3FE0FF; --sun:#FFE14D;
  --retro:"Righteous","Baloo 2",system-ui,sans-serif;
  --display:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.7) 2px, transparent 2.5px);background-size:26px 26px;}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:4px solid var(--b);outline-offset:3px}
.app{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:12px 40px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05}
.label{font-family:var(--display);font-weight:700;font-size:1.25rem;color:var(--pink-deep);margin:0 0 10px;display:flex;align-items:center;gap:8px}

/* ---------- 80s hero ---------- */
.hero80{position:relative;overflow:hidden;border-radius:28px;margin-top:6px;
  background:linear-gradient(var(--night) 0%, #5B157A 42%, var(--pink) 72%, var(--o) 100%);box-shadow:0 7px 0 var(--pink-deep)}
.hero80 .sun{position:absolute;left:50%;bottom:30%;width:min(56vw,300px);aspect-ratio:1;transform:translate(-50%,50%);border-radius:50%;
  background:linear-gradient(var(--sun),var(--pink));
  -webkit-mask:linear-gradient(#000 0 50%,transparent 50% 54%,#000 54% 62%,transparent 62% 67%,#000 67% 74%,transparent 74% 80%,#000 80%);
          mask:linear-gradient(#000 0 50%,transparent 50% 54%,#000 54% 62%,transparent 62% 67%,#000 67% 74%,transparent 74% 80%,#000 80%)}
.hero80 .floor{position:absolute;left:-20%;right:-20%;bottom:0;height:32%;background-color:var(--night);
  background-image:linear-gradient(var(--neon) 2px,transparent 2px),linear-gradient(90deg,var(--neon) 2px,transparent 2px);background-size:40px 26px;
  transform:perspective(160px) rotateX(48deg);transform-origin:bottom;opacity:.9}
.hero-inner{position:relative;display:grid;grid-template-columns:1fr minmax(150px,42%);align-items:end;gap:8px;padding:18px 18px 10px}
.logo{font-family:var(--retro);font-weight:400;font-size:clamp(2.6rem,10vw,4.4rem);line-height:.95;transform:skew(-8deg);letter-spacing:.01em;
  background:linear-gradient(#FFFBD1 0%,var(--sun) 40%,var(--o) 62%,var(--pink) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(3px 3px 0 var(--neon)) drop-shadow(0 0 10px rgba(63,224,255,.5))}
.logo-name{display:block;font-size:.6em;line-height:1;margin-bottom:.06em;letter-spacing:.04em}
.tagline{font-family:var(--retro);color:var(--neon);letter-spacing:.18em;text-transform:uppercase;font-size:.85rem;margin:6px 0 0;transform:skew(-8deg)}
.greet{font-family:var(--display);font-weight:800;color:#fff;font-size:clamp(1.25rem,4.6vw,1.7rem);margin:14px 0 18px;text-shadow:0 2px 0 rgba(36,8,63,.5)}
.hero-art svg{width:100%;height:auto;display:block;animation:lift 1.4s ease-in-out infinite alternate}
@keyframes lift{from{transform:translateY(6px)}to{transform:translateY(-6px)}}
@media (max-width:520px){.hero-inner{grid-template-columns:1fr;justify-items:center;text-align:center}.hero-art{width:min(70%,230px)}.greet{margin-bottom:4px}}

/* ---------- Achievements ---------- */
.panelcard{margin-top:22px;background:var(--card);border-radius:28px;padding:18px;box-shadow:0 6px 0 var(--line)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.stat{display:flex;align-items:center;gap:8px;background:var(--bg-2);border-radius:999px;padding:6px 16px 6px 10px;font-family:var(--display);font-weight:800;font-size:1.4rem}
.stat small{font-family:var(--body);font-weight:700;font-size:.85rem;color:var(--ink-soft)}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:12px}
.slot{display:grid;justify-items:center;gap:4px}
.badge{--tier:var(--line);position:relative;width:68px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:32px;
  background:var(--card);border:6px solid var(--tier);box-shadow:0 0 0 4px var(--c),0 5px 0 4px rgba(74,24,56,.12)}
.badge.guld{--tier:var(--gold)}.badge.silver{--tier:var(--silver)}.badge.brons{--tier:var(--bronze)}
.badge.tom{border-style:dashed;box-shadow:none;background:var(--bg-2)}
.badge.tom span{filter:grayscale(1);opacity:.28}
.count{position:absolute;right:-8px;top:-6px;background:var(--pink);color:#fff;font-family:var(--display);font-weight:800;font-size:.8rem;border-radius:999px;padding:0 7px;line-height:1.6}
.slot-name{font-size:.75rem;font-weight:800;color:var(--ink-soft);text-align:center}
.trophies{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.trophy{display:flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px 6px 8px;background:var(--bg-2);font-weight:800;font-size:.85rem}
.trophy .e{font-size:1.4rem}
.trophy.no{opacity:.4}.trophy.no .e{filter:grayscale(1)}

/* ---------- Levels ---------- */
.levels-wrap{margin-top:26px}
.levels-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.levels-head .label{margin:0}
.calm{display:flex;align-items:center;gap:12px;border:0;border-radius:999px;background:var(--card);padding:8px 10px 8px 16px;font-family:var(--display);font-weight:800;font-size:1.1rem;box-shadow:0 5px 0 var(--line)}
.calm .sw{width:58px;height:32px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.calm .sw::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--card);transition:left .2s}
.calm[aria-pressed="true"] .sw{background:var(--g)}
.calm[aria-pressed="true"] .sw::after{left:30px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.level{position:relative;display:grid;gap:6px;justify-items:center;text-align:center;padding:16px 10px 14px;border-radius:26px;
  background:var(--card);border:4px solid var(--c);box-shadow:0 7px 0 var(--c);transition:transform .08s}
.level:active{transform:translateY(5px);box-shadow:0 2px 0 var(--c)}
.level .eq{font-size:clamp(1.8rem,7vw,2.3rem)}
.lv-name{font-family:var(--display);font-weight:800;font-size:1.05rem}
.lv-num{position:absolute;left:10px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--display);font-weight:800;display:grid;place-items:center;font-size:.95rem}
.lv-emoji{position:absolute;right:10px;top:6px;font-size:1.4rem}
.lv-stars{letter-spacing:2px;font-size:1.05rem;color:var(--gold)}
.off{color:var(--line)}
.lv-best{font-family:var(--display);font-weight:800;font-size:.95rem;color:var(--ink-soft)}
.level.locked{filter:grayscale(.85);opacity:.55;box-shadow:0 7px 0 var(--silver);border-color:var(--silver)}
.lock{position:absolute;inset:0;display:grid;place-items:center;font-size:2.6rem}
.help-tag{font-size:.75rem;font-weight:800;background:var(--y);border-radius:999px;padding:1px 8px}

/* ---------- Records ---------- */
.tabs{display:inline-flex;background:var(--bg-2);border-radius:999px;padding:4px;gap:4px;margin-bottom:12px}
.tab{border:0;background:none;border-radius:999px;padding:6px 16px;font-family:var(--display);font-weight:800;font-size:1rem;color:var(--ink-soft)}
.tab[aria-selected="true"]{background:var(--pink);color:#fff}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.rec{border:3px solid var(--c);border-radius:18px;padding:10px 12px;min-width:0}
.rec h3{font-size:1.05rem;display:flex;gap:6px;align-items:center;margin-bottom:6px}
.hs{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-variant-numeric:tabular-nums}
.hs li{display:grid;grid-template-columns:1.6em 1fr auto;gap:8px;align-items:baseline;padding:2px 8px;border-radius:10px}
.hs li b{font-family:var(--display);font-size:1.15rem}
.hs li .d{font-size:.8rem;color:var(--ink-soft);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hs li .pos{font-weight:800;color:var(--ink-soft)}
.hs li.new{background:var(--y)}
.hs.admin li{grid-template-columns:1.6em 1fr auto auto}
.delbtn{border:0;background:var(--bg-2);color:var(--rt);font-weight:800;font-size:.75rem;border-radius:999px;padding:1px 7px;line-height:1.5}
.delbtn.armed{background:var(--rt);color:#fff}
.empty{color:var(--ink-soft);font-weight:700;font-size:.9rem;display:block}

/* ---------- Equations ---------- */
.eq{font-family:var(--display);font-weight:800;line-height:1.1;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.22em;font-variant-numeric:tabular-nums}
.op{color:var(--ink)}
.box{display:inline-block;min-width:1.6em;padding:0 .12em;border-bottom:.1em solid var(--pink);text-align:center;color:var(--ink);min-height:1.1em}
.box.live{animation:blink 1.1s steps(2) infinite}
.box.right{color:var(--gt);border-color:var(--g)}
.box.shown{color:var(--bt);border-color:var(--b)}
.box.wait{color:var(--line)}
@keyframes blink{50%{border-color:var(--line)}}

/* ---------- Play ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px}
.iconbtn{width:52px;height:52px;border-radius:50%;border:0;background:var(--card);font-size:1.5rem;box-shadow:0 4px 0 var(--line);flex:none}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.dots{display:flex;gap:8px}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;background:var(--card);border:3px solid var(--line);color:var(--gold)}
.dot.now{border-color:var(--pink);animation:pulse 1.2s ease-in-out infinite}
.dot.miss{color:var(--silver)}
@keyframes pulse{50%{transform:scale(1.15)}}
.sportbar{display:flex;justify-content:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:999px;padding:4px 16px;font-family:var(--display);font-weight:800;font-size:1.5rem;box-shadow:0 4px 0 var(--line);font-variant-numeric:tabular-nums}
.chip small{font-size:.9rem;color:var(--ink-soft)}
.chip.clock b{color:var(--bt)}.chip.pts b{color:var(--pink-deep)}
.qcard{position:relative;background:var(--card);border-radius:30px;padding:22px 14px 18px;box-shadow:0 7px 0 var(--line);display:grid;gap:10px;margin-top:10px}
.qcard>.eq{font-size:clamp(2.5rem,12vw,4.6rem)}
.qcard.dim>.eq{opacity:.55;font-size:clamp(1.9rem,8vw,3rem)}
.words{text-align:center;font-weight:800;color:var(--ink-soft);font-size:1.1rem;overflow-wrap:anywhere}
.steps{display:grid;gap:10px;margin-top:4px}
.steps-lead{margin:0;text-align:center;font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--pink-deep)}
.step{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:20px;padding:8px 10px;border:3px solid transparent;flex-wrap:wrap}
.step .eq{font-size:clamp(1.7rem,8vw,2.6rem)}
.step.aktiv{background:var(--bg-2);border:3px dashed var(--pink)}
.step.klar{background:color-mix(in srgb,var(--g) 14%,var(--card))}
.step.sen{opacity:.45}
.snum{width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.step.klar .snum{background:var(--g)}
.plus{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:2.6rem;color:var(--gt);pointer-events:none;animation:rise 1.2s ease-out forwards}
@keyframes rise{to{transform:translate(-50%,-70px);opacity:0}}
.feedback{min-height:2.3em;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,5vw,1.7rem);margin-top:8px}
.feedback.ok{color:var(--gt)}.feedback.nej{color:var(--pink-deep)}.feedback.info{color:var(--bt)}
.helprow{display:flex;justify-content:center;min-height:62px}
.helpbtn{display:flex;align-items:center;gap:10px;border:0;border-radius:999px;background:var(--y);padding:8px 26px;font-family:var(--display);font-weight:800;font-size:1.5rem;box-shadow:0 5px 0 var(--yt)}
.helpbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--yt)}
.wiggle{animation:wiggle .5s ease-in-out 3}
@keyframes wiggle{25%{transform:rotate(-6deg) scale(1.08)}75%{transform:rotate(6deg) scale(1.08)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.padwrap{position:relative}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:430px;margin:10px auto 0}
.key{border:0;border-radius:22px;background:var(--card);min-height:68px;font-family:var(--display);font-weight:800;font-size:2.2rem;box-shadow:0 6px 0 var(--line);transition:transform .06s}
.key:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.key.del{background:var(--bg-2);font-size:1.7rem}
.key.ok{background:var(--pink);color:#fff;box-shadow:0 6px 0 var(--pink-deep)}
.key.ok:active{box-shadow:0 1px 0 var(--pink-deep)}
.troll{position:absolute;inset:-8px;z-index:5;border-radius:28px;background:rgba(74,24,56,.55);display:grid;place-items:center;align-content:center;gap:4px;overflow:hidden}
.troll svg{width:min(62%,230px);height:auto;animation:flyin .7s cubic-bezier(.3,1.4,.5,1),hover 1s ease-in-out .7s infinite alternate}
.troll.leave svg{animation:flyout .5s ease-in forwards}
.troll .steal{font-family:var(--display);font-weight:800;color:#fff;font-size:1.6rem;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.troll .cd{font-family:var(--display);font-weight:800;color:var(--y);font-size:4rem;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.25)}
@keyframes flyin{from{transform:translate(140%,-140%) rotate(40deg) scale(.4)}}
@keyframes hover{to{transform:translateY(-10px) rotate(-4deg)}}
@keyframes flyout{to{transform:translate(-160%,-160%) rotate(-50deg) scale(.3)}}
.demobar{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.demobar span{font-weight:800;color:var(--ink-soft)}
.pbtn{border:2px solid var(--line);background:var(--bg-2);border-radius:14px;padding:10px 14px;font-weight:800}

/* ---------- Reward & pause ---------- */
.center{display:grid;justify-items:center;text-align:center;gap:14px;padding-top:24px}
.burstwrap{position:relative;width:min(80vw,280px);aspect-ratio:1;display:grid;place-items:center}
.burst{position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(var(--r) 0 15deg,var(--o) 15deg 30deg,var(--y) 30deg 45deg,var(--g) 45deg 60deg,var(--b) 60deg 75deg,var(--v) 75deg 90deg);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 18s linear infinite;opacity:.85}
@keyframes spin{to{transform:rotate(1turn)}}
.burstwrap .badge{width:calc(min(80vw,280px) * .55);font-size:clamp(3.5rem,16vw,5.5rem);border-width:12px;box-shadow:0 0 0 8px var(--c),0 10px 0 8px rgba(74,24,56,.15);animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2) rotate(-30deg)}}
.reward-title{font-size:clamp(2.2rem,9vw,3.4rem);color:var(--pink-deep);font-weight:800}
.bigstars{font-size:clamp(2rem,9vw,2.8rem);letter-spacing:4px;color:var(--gold)}
.reward-score{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,2.2rem)}
.reward-score b{color:var(--pink-deep);font-size:1.4em}
.news{display:grid;gap:8px;justify-items:center}
.pill{background:var(--card);border-radius:999px;padding:8px 18px;font-family:var(--display);font-weight:800;font-size:1.2rem;box-shadow:0 4px 0 var(--line)}
.reward-boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;width:100%;max-width:560px}
.reward-hs{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 5px 0 var(--line);text-align:left;min-width:0}
.reward-hs h3{text-align:center;margin-bottom:8px}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:8px}
.choice{display:grid;justify-items:center;gap:2px;min-width:120px;border:0;border-radius:26px;padding:12px 18px;background:var(--card);box-shadow:0 6px 0 var(--line);font-family:var(--display);font-weight:800;font-size:1.15rem}
.choice .e{font-size:2.4rem;line-height:1.1}
.choice:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.choice.main{background:var(--pink);color:#fff;box-shadow:0 6px 0 var(--pink-deep)}
.sleepy{font-size:6rem;line-height:1}
#konfetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

/* ---------- Login ---------- */
.loginbox{margin:22px auto 0;max-width:420px;background:var(--card);border-radius:28px;padding:22px;box-shadow:0 6px 0 var(--line);display:grid;gap:10px}
.loginbox label{font-weight:800}
.loginbox input{font:inherit;font-size:1.2rem;padding:12px 14px;border-radius:14px;border:3px solid var(--line);width:100%;color:var(--ink);background:var(--bg-2)}

};

/* Accounts that may remove records from the scoreboards (Firebase user UIDs). */
const ADMIN_UIDS = ['sE6TcKfC2rgOtwPCN56Xdu0d2em2'];

const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const OPW={'+':'plus','−':'minus','×':'gånger','÷':'delat med'};
const RB=['rt','ot','yt','gt','bt','vt'];
const ROUND=5, MAX_POINTS=ROUND*100;

document.querySelectorAll('[data-hero]').forEach(h=>h.replaceWith($('#heroTpl').content.cloneNode(true)));

/* ---------- Swedish number words ---------- */
const ONES=['noll','ett','två','tre','fyra','fem','sex','sju','åtta','nio','tio','elva','tolv','tretton','fjorton','femton','sexton','sjutton','arton','nitton'];
const TENS=['','','tjugo','trettio','fyrtio','femtio','sextio','sjuttio','åttio','nittio'];
function sv(n){
  if(n<20) return ONES[n];
  if(n<100) return TENS[Math.floor(n/10)]+(n%10?ONES[n%10]:'');
  if(n<1000){const h=Math.floor(n/100),r=n%100;return (h===1?'ett':ONES[h])+'hundra'+(r?sv(r):'');}
  const t=Math.floor(n/1000),r=n%1000;return (t===1?'ett':sv(t))+'tusen'+(r?sv(r):'');
}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const wordsOf=t=>cap(t.map(x=>typeof x==='number'?sv(x):OPW[x]).join(' '));
function calc(a,op,b){return op==='+'?a+b:op==='−'?a-b:op==='×'?a*b:a/b}
function evalT(t){
  if(t.length===3) return calc(t[0],t[1],t[2]);
  if(t[1]==='×'||t[1]==='÷') return calc(calc(t[0],t[1],t[2]),t[3],t[4]);
  return calc(t[0],t[1],calc(t[2],t[3],t[4]));
}
function eqHTML(t){
  let ci=0;
  return t.map(x=>typeof x==='number'
    ? '<span class="num">'+String(x).split('').map(d=>`<span style="color:var(--${RB[ci++%6]})">${d}</span>`).join('')+'</span>'
    : `<span class="op">${x}</span>`).join('');
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Questions ---------- */
function mk(t){return {t,ans:evalT(t),help:null}}
function splitHelp(a,b){
  let s;
  if(b>=11&&b<=20) s=[{t:[a,'×',10]},{t:[a,'×',b-10]}];
  else if(a>=11&&a<=20) s=[{t:[10,'×',b]},{t:[a-10,'×',b]}];
  else return null;
  s.forEach(x=>x.ans=evalT(x.t));
  s.push({t:[s[0].ans,'+',s[1].ans],ans:s[0].ans+s[1].ans});
  return s;
}
const LEVELS=[
  {id:'plus',name:'Plus och minus',c:'r',emoji:'🐞',sample:[5,'+',5],gen(){
    if(Math.random()<.6) return mk([rnd(2,30),'+',rnd(2,20)]);
    const a=rnd(10,40);return mk([a,'−',rnd(2,a-2)]);}},

    const a=rnd(2,9),b=rnd(2,9),c=rnd(2,20),p=a*b;let op=Math.random()<.65?'+':'−';if(op==='−'&&p<=c)op='+';
    const ans=calc(p,op,c);return {t:[a,'×',b,op,c],ans,help:[{t:[a,'×',b],ans:p},{t:[p,op,c],ans}]};}},

function makeRound(L){const seen=new Set(),qs=[];let g=0;

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function initCloud(){

const toEmail=name=>name.trim().toLowerCase().replace(/[åä]/g,'a').replace(/ö/g,'o').replace(/[^a-z0-9_-]/g,'')+'@sportmatte.app';
function authError(e){
  const c=e&&e.code||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'Fel namn eller lösenord.';
  if(c.includes('email-already-in-use'))return 'Det namnet är redan taget. Välj ett annat.';
  if(c.includes('weak-password'))return 'Lösenordet måste vara minst 6 tecken.';
  if(c.includes('too-many-requests'))return 'För många försök. Vänta en stund och försök igen.';
  if(c.includes('network'))return 'Ingen internetanslutning.';
  return 'Något gick fel. Försök igen.';
}
function validName(n){return /^[A-Za-zÅÄÖåäö0-9_-]{2,16}$/.test(n.trim())}
async function doAuth(create){
  const name=$('#user').value.trim(),pw=$('#pass').value,err=$('#loginErr');
  if(!validName(name)){err.textContent='Namnet ska vara 2–16 bokstäver eller siffror, utan mellanslag.';return}
  if(pw.length<6){err.textContent='Lösenordet måste vara minst 6 tecken.';return}
  err.textContent='';$('#loginBtn').disabled=$('#signupBtn').disabled=true;
  try{
    if(create){
      const c=await FB.auth.createUserWithEmailAndPassword(toEmail(name),pw);
      await FB.db.collection('users').doc(c.user.uid).set({name,progress:defaults()},{merge:true});
    }else await FB.auth.signInWithEmailAndPassword(toEmail(name),pw);
  }catch(e){err.textContent=authError(e)}
  finally{$('#loginBtn').disabled=$('#signupBtn').disabled=false}
}

let AC;
function tone(f,at,dur,type='triangle',g=.14){
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime+at,o=AC.createOscillator(),v=AC.createGain();
    o.type=type;o.frequency.value=f;v.gain.setValueAtTime(.0001,n);v.gain.linearRampToValueAtTime(g,n+.02);v.gain.exponentialRampToValueAtTime(.0001,n+dur);
    o.connect(v).connect(AC.destination);o.start(n);o.stop(n+dur+.05)}catch(e){}
}
const ding=()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.07,.3));
const blip=()=>[659,880].forEach((f,i)=>tone(f,i*.07,.2));

/* ---------- Confetti ---------- */
function confetti(n=170){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#konfetti'),x=c.getContext('2d'),dpr=devicePixelRatio||1;
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#FF595E','#FF9F1C','#FFCA3A','#38C98A','#3FA9F5','#9B5DE5','#FF3E9A'];
  const ps=Array.from({length:n},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,
    r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:6+Math.random()*8,h:4+Math.random()*6,c:pick(cols)}));
  const end=Date.now()+3800;
  (function f(){x.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(Date.now()<end)requestAnimationFrame(f);else x.clearRect(0,0,innerWidth,innerHeight)})();
}

function render(){

      return `<div class="step ${cls}"><span class="snum">${k<R.step?'✓':k+1}</span>${body}</div>`}).join('');

function showInput(){
  const main=$('#mainBox');if(!main)return;

}

function press(k){
  if(!R||R.busy)return;
  if(k==='ok')return submit();
  if(k==='del')R.input=R.input.slice(0,-1);else if(R.input.length<5)R.input=(R.input==='0'?'':R.input)+k;

function shakeEl(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
const PRAISE=['Rätt! Bra jobbat!','Snyggt räknat!','Wow, en mattestjärna!','Helt rätt!','Superbra!','Ja! Det stämmer!'];
const WRONG=['Nästan! Försök igen.','Inte riktigt. Testa en gång till!'];
function submit(){
  if(!R.input)return;
  const q=cur(),v=+R.input,target=R.helpOn?q.help[R.step].ans:q.ans;
  if(v===target){
    if(R.helpOn&&R.step<q.help.length-1){R.step++;R.input='';R.tries=0;render();blip();fb('Rätt! Nästa steg.','ok');return}
    return solved(true);
  }
  R.tries++;R.input='';showInput();
  if(R.sport){buzz();trollSteal(()=>afterWrong(q));return}
  buzz();shakeEl($('#qcard'));afterWrong(q);
}
function afterWrong(q){
  if(R.helpOn&&R.tries>=3){
    const s=q.help[R.step];
    if(R.step<q.help.length-1){R.step++;R.tries=0;render();fb(`Det blir ${s.ans}.`,'info');return}
    return reveal();
  }
  if(!R.helpOn&&q.help&&R.tries>=2){openHelp();return}
  if(!R.helpOn&&R.tries>=3)return reveal();
  fb(pick(WRONG),'nej');showInput();
  if(q.help&&!R.helpOn){const h=$('#helpBtn');h.classList.remove('wiggle');void h.offsetWidth;h.classList.add('wiggle')}
}
function openHelp(){
  const q=cur();if(!q.help||R.busy)return;

}
function solved(star){
  R.busy=true;R.timing=false;const q=cur();

  R.res.push(star);
  const m=$('#mainBox');m.textContent=q.ans;m.className='box right';
  if(R.helpOn){const b=$('#sbox'+R.step);if(b){b.textContent=q.ans;b.className='box right'}}
  if(R.sport){const sec=(performance.now()-R.qStart)/1000,pts=Math.max(10,Math.round(100-2*sec));R.points+=pts;
    $('#score').textContent=R.points;$('#clock').textContent=fmt(sec);
    const pl=document.createElement('div');pl.className='plus';pl.textContent='+'+pts;$('#qcard').appendChild(pl);}
  ding();confetti(40);fb(pick(PRAISE),'ok');
  setTimeout(next,1600);
}
function reveal(){

function finish(){
  const L=LEVELS[R.level],s=R.stars,tier=s===5?'guld':s>=3?'silver':'brons';
  const before=JSON.stringify(P);
  let hi=-1,list=null,prevBest=((P.hs[L.id]||[])[0]||{}).p||0;
  if(R.sport){const d=new Date(),e={p:R.points,d:d.getDate()+'/'+(d.getMonth()+1),ts:Date.now()};
    list=[...(P.hs[L.id]||[]),e].sort((a,b)=>b.p-a.p||a.ts-b.ts).slice(0,5);hi=list.indexOf(e);P.hs[L.id]=list;}
  P.stars+=s;P.rounds++;
  const t=P.tiers[L.id]=P.tiers[L.id]||{};t[tier]=(t[tier]||0)+1;
  P.best[L.id]=Math.max(P.best[L.id]||0,s);
  let opened=false;
  if(s>=3&&R.level+1===P.unlocked&&P.unlocked<LEVELS.length){P.unlocked++;opened=!DEMO}
  const newT=TROPHIES.filter(T=>!P.trophies[T.id]&&T.test());newT.forEach(T=>P.trophies[T.id]=Date.now());
  if(DEMO){/* show everything, keep nothing */}else save();

  const news=[];
  if(R.sport&&hi===0&&R.points>prevBest)news.push('🏆 Nytt rekord!');
  if(opened)news.push(`🔓 Ny nivå: ${LEVELS[R.level+1].name}`);
  newT.forEach(T=>news.push(`${T.e} Nytt pris: ${T.name}`));
  if(DEMO)P=JSON.parse(before);

  $('#rBadge').innerHTML=badgeHTML(L,tier,0);
  $('#rTitle').textContent=TIER_NAME[tier]+'!';
  $('#rStars').innerHTML='★'.repeat(s)+`<span class="off">${'★'.repeat(5-s)}</span>`;
  $('#rScore').hidden=!R.sport;$('#rScore').innerHTML=`Poäng <b>${R.points}</b>`;
  $('#rNews').innerHTML=news.map(n=>`<span class="pill">${n}</span>`).join('');
  const boards=$('#rBoards');boards.hidden=!R.sport;
  if(R.sport){
    boards.innerHTML=`<div class="reward-hs"><h3>Mina rekord</h3>${listHTML(mineRows(list),hi)}</div>`+(FB&&ME?`<div class="reward-hs" id="rAll"><h3>Alla · ${L.name}</h3><span class="empty">Laddar …</span></div>`:'');
    if(FB&&ME){
      const lvl=L.id,pts=R.points;
      submitBoard(lvl,pts).then(()=>topBoard(lvl,5)).then(rows=>{
        const el=$('#rAll');if(el)el.innerHTML=`<h3>Alla · ${L.name}</h3>`+listHTML(allRows(rows),rows.findIndex(e=>e.uid===ME.uid));
      }).catch(()=>{const el=$('#rAll');if(el)el.querySelector('.empty').textContent='Kunde inte hämta topplistan.'});
    }
  }
  const nextOk=R.level+1<LEVELS.length&&unlocked(R.level+1)&&s>=3;
  $('#rChoices').innerHTML=
    (nextOk?`<button class="choice main" data-act="next"><span class="e">🚀</span>Nästa nivå</button>`:'')+
    `<button class="choice ${nextOk?'':'main'}" data-act="again"><span class="e">🔁</span>Igen</button>`+
    `<button class="choice" data-act="home"><span class="e">🗺️</span>Ny utmaning</button>`+
    `<button class="choice" data-act="pause"><span class="e">😴</span>Paus</button>`;
  show('reward');fanfare();confetti();
}

/* ---------- Events ---------- */
$('#levels').addEventListener('click',e=>{const b=e.target.closest('.level');if(b)startLevel(+b.dataset.i)});
$('#calmBtn').onclick=()=>{P.sport=!P.sport;save();renderHome()};
$('#recGrid').addEventListener('click',async e=>{
  const b=e.target.closest('[data-del]');if(!b||!isAdmin())return;
  if(!b.classList.contains('armed')){ // first click asks, second click removes
    document.querySelectorAll('.delbtn.armed').forEach(x=>{x.classList.remove('armed');x.textContent='✕'});
    b.classList.add('armed');b.textContent='Ta bort?';return}
  const [kind,lvl,key]=b.dataset.del.split('|');
  b.disabled=true;b.textContent='…';
  if(kind==='mine'){const l=P.hs[lvl]||[];l.splice(+key,1);P.hs[lvl]=l;save();renderHome();return}
  try{await FB.db.collection('boards').doc(lvl).collection('best').doc(key).delete();renderRecords()}
  catch(err){b.disabled=false;b.textContent='Gick inte';console.warn(err)}
});
$('#recTabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;recTab=t.dataset.tab;renderRecords()});
$('#pad').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)press(b.dataset.k)});
$('#helpBtn').onclick=()=>openHelp();
$('#homeBtn').onclick=()=>{document.querySelectorAll('.troll').forEach(t=>t.remove());R=null;renderHome()};
$('#rChoices').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const lv=R.level;
  ({next:()=>startLevel(lv+1),again:()=>startLevel(lv),home:renderHome,pause:()=>show('pause')})[b.dataset.act]()});
$('#backBtn').onclick=renderHome;
$('#demoRight').onclick=()=>{if(!R||R.busy)return;const q=cur();R.input=String(R.helpOn?q.help[R.step].ans:q.ans);showInput();setTimeout(()=>press('ok'),250)};
$('#demoWrong').onclick=()=>{if(!R||R.busy)return;const q=cur();R.input=String((R.helpOn?q.help[R.step].ans:q.ans)+1);showInput();setTimeout(()=>press('ok'),250)};
$('#demoBtn').onclick=()=>{DEMO=!DEMO;try{localStorage.setItem(DEMO_KEY,DEMO?'1':'0')}catch(e){}
  if($('#home').hidden){renderFoot()}else renderHome()};
$('#logoutBtn').onclick=()=>{if(FB)FB.auth.signOut()};
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();doAuth(false)});
$('#signupBtn').onclick=()=>doAuth(true);
document.addEventListener('keydown',e=>{
  if($('#play').hidden)return;
  if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('del');else if(e.key==='Enter')press('ok');
});

/* ---------- Start ---------- */
if(FIREBASE_CONFIG){
  initCloud().catch(e=>{console.warn('Firebase kunde inte laddas, kör lokalt',e);FB=null;P=loadLocal();renderHome()});
}else{P=loadLocal();renderHome()}
</script>
</body>
</html>
